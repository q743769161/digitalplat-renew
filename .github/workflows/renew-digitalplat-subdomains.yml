name: DigitalPlat Auto Renew

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only, do not renew domains"
        required: true
        default: true
        type: boolean

concurrency:
  group: digitalplat-auto-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: Run DigitalPlat renewal
        env:
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          DIGITALPLAT_REMEMBER_TOKEN: ${{ secrets.DIGITALPLAT_REMEMBER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name == 'schedule' }}

        run: |
          python auto_renew.py
